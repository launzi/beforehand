<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beforehand — Settings</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><h1>Settings</h1></header>
<form id="form">
<section class="panel"><h2>AI provider</h2>
  <div id="providers" class="provider-segments" role="radiogroup" aria-label="AI provider"></div>
  <label for="providerKey">API key</label>
  <div class="key-entry"><input id="providerKey" type="password" autocomplete="off" spellcheck="false"><button type="button" id="toggleKey" class="secondary-action" aria-label="Show key"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></svg></button></div>
  <p id="keyHelp" class="detail-caption"></p>
  <p class="detail-caption">Stored only on this device. Never written to the local log.</p></section>
<section class="panel"><h2>Research &amp; quotes</h2>
  <div id="policy" class="policy-segments" role="radiogroup" aria-label="Research and quotes">
    <label><input type="radio" name="policy" value="allow"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12 4 4L19 6"/></svg> Allow</span></label><label><input type="radio" name="policy" value="hold"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14M16 5v14"/></svg> Hold</span></label><label><input type="radio" name="policy" value="deny"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg> Deny</span></label></div>
  <details><summary>Details</summary><p id="digest" class="digest"></p></details>
  <label for="country">Ship to</label><select id="country"><option value="US">US</option><option value="GB">GB</option><option value="JP">JP</option><option value="CN">CN</option><option value="TW">TW</option><option value="HK">HK</option></select>
  <label for="excluded">Exclude websites</label><textarea id="excluded" rows="4" spellcheck="false" placeholder="example.com"></textarea></section>
<button type="submit" class="primary-action">Save</button></form>
<p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p>
<section class="panel danger-zone"><h2>Delete</h2>
  <button id="clearTrace" class="destructive-action">Delete local log</button><button id="clearAll" class="destructive-action">Withdraw consent and delete everything</button></section>
<footer><a href="privacy.html">Privacy</a> · Munteok · Apache-2.0</footer></main><script type="module" src="options.js"></script></body></html>
