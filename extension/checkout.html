<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout · beforehand</title><link rel="stylesheet" href="style.css"></head>
<body><main class="welcome"><img class="lockup" src="icons/lockup.svg" alt="beforehand" width="214" height="48"><h1>Buy from Korea</h1>
<div id="summary"></div>
<form id="checkoutForm" hidden>
<label for="email">Email</label><input id="email" type="email" required maxlength="200" autocomplete="email">
<label for="name">Name</label><input id="name" type="text" required maxlength="120" autocomplete="name">
<button id="continue" type="submit" disabled>Continue to payment</button>
<p>Sent to Korea Concierge to create your order. Not stored by beforehand.</p>
</form><p id="notice" role="status">Loading your quote…</p></main><script type="module" src="checkout.js"></script></body></html>
